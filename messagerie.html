<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>NowCalculatrice — Chat commun</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2632;--line:#30404f;--accent:#1687f8;--muted:#9aaaba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fa;font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}header{height:60px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:#141e28;position:sticky;top:0}main{max-width:720px;margin:auto;padding:14px;display:flex;flex-direction:column;min-height:calc(100dvh - 60px)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}h1{font-size:21px;margin:0 0 7px}p{color:#c1ccd6;line-height:1.4;margin:5px 0 12px}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid var(--line)}input{background:#111b25;color:#fff;min-width:0}button{background:var(--accent);color:white;border:0;font-weight:650;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row input[type=color]{flex:0 0 48px;height:46px;padding:4px}#status{font-size:13px;color:#b9c8d5;min-height:24px;padding:4px}#chat{flex:1;min-height:260px;max-height:calc(100dvh - 260px);overflow:auto;padding:12px;background:#121c26;border:1px solid var(--line);border-radius:16px}.msg{max-width:86%;padding:10px 13px;margin:8px 0;border-radius:16px;background:#293746;overflow-wrap:anywhere;white-space:pre-wrap}.msg.mine{margin-left:auto;background:#075fba}.msg small{display:block;font-size:11px;margin-bottom:4px;color:#d0deeb}.msg img{display:block;max-width:100%;max-height:300px;border-radius:10px;margin-top:5px}.msg audio{display:block;max-width:100%;width:260px;margin-top:6px}#composer{display:flex;gap:7px;align-items:center;margin-top:10px;background:#111b25;border:1px solid #435365;border-radius:16px;padding:6px}#message{flex:1;border:0;background:transparent;outline:none;padding:9px}#composer button{padding:10px}.secondary{background:#293746;border:1px solid #435365}.small{font-size:12px;color:var(--muted)}
</style></head><body><header><strong>📱 NowCalculatrice · Messagerie</strong></header><main>
<section class="panel"><h1>Chat commun</h1><p>Choisis ton pseudonyme et ta couleur. Partage cette adresse avec tes deux amis. Aucun accusé de lecture « Vu ».</p><div class="row"><input id="nickname" maxlength="32" placeholder="Ton pseudonyme"><input id="color" type="color" value="#1687f8" aria-label="Couleur de profil"><button id="save">OK</button></div></section>
<div id="status" role="status">Connexion…</div><div id="chat" aria-live="polite"></div>
<form id="composer"><button id="photo" class="secondary" type="button" title="Photo">▧</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="message" maxlength="4000" placeholder="Écrire un message…" autocomplete="off"><button id="mic" class="secondary" type="button" title="Message vocal">🎙</button><button id="send" type="submit">➤</button></form><p class="small">Salon partagé · messages enregistrés sur le serveur.</p></main>
<script>
const $=id=>document.getElementById(id), API="/api", PKEY="nowcalc-chat-profile-v1", IKEY="nowcalc-chat-device-v1";
let profile=JSON.parse(localStorage.getItem(PKEY)||"null"), sender=localStorage.getItem(IKEY);
if(!sender){sender="u_"+crypto.randomUUID().replaceAll("-","");localStorage.setItem(IKEY,sender)}
let last=0, recorder=null, chunks=[], stream=null;const seen=new Set();
function status(s){$("status").textContent=s}
function save(){const nickname=$("nickname").value.trim().slice(0,32);if(!nickname){status("Entre un pseudonyme.");return false}profile={nickname,color:$("color").value};localStorage.setItem(PKEY,JSON.stringify(profile));status("Profil enregistré.");return true}
$("nickname").value=profile?.nickname||"";$("color").value=profile?.color||"#1687f8";$("save").onclick=save;
function render(m){if(!m||seen.has(String(m.id)))return;seen.add(String(m.id));last=Math.max(last,Number(m.id)||0);const el=document.createElement("div");el.className="msg"+(m.sender_id===sender?" mine":"");const who=document.createElement("small");who.textContent=(m.sender_id===sender?"Moi · ":"")+m.nickname;who.style.color=m.color||"#fff";el.append(who);let a;try{a=JSON.parse(m.body);if(!a||a.__nowcalc_attachment!==1)a=null}catch{}if(a){const url=API+"/attachments/"+encodeURIComponent(a.id);if(a.mime.startsWith("image/")){const im=document.createElement("img");im.src=url;im.alt=a.name||"Photo";el.append(im)}else{const au=document.createElement("audio");au.controls=true;au.src=url;el.append(au)}}else{const b=document.createElement("div");b.textContent=m.body;el.append(b)}$("chat").append(el);$("chat").scrollTop=$("chat").scrollHeight}
async function refresh(){const r=await fetch(API+"/messages?after="+last,{cache:"no-store"});if(!r.ok)throw Error("Serveur "+r.status);const d=await r.json();(d.messages||[]).forEach(render)}
async function post(body){if(!profile?.nickname)throw Error("Enregistre ton pseudonyme.");const r=await fetch(API+"/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sender_id:sender,nickname:profile.nickname,color:profile.color,body})});const d=await r.json();if(!r.ok)throw Error(d.error||"Envoi impossible");render(d.message)}
async function upload(file){if(!profile?.nickname)throw Error("Enregistre ton pseudonyme.");if(file.size>20*1024*1024)throw Error("Maximum 20 Mo.");const data=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.onerror=no;fr.readAsDataURL(file)});const r=await fetch(API+"/attachments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sender_id:sender,nickname:profile.nickname,color:profile.color,mime:file.type,filename:file.name,data})});const d=await r.json();if(!r.ok)throw Error(d.error||"Échec");render(d.message)}
$("photo").onclick=()=>$("file").click();$("file").onchange=async()=>{try{if($("file").files[0]){status("Envoi de la photo…");await upload($("file").files[0]);status("Photo envoyée.")}}catch(e){status(e.message)}finally{$("file").value=""}};
$("mic").onclick=async()=>{if(recorder?.state==="recording"){recorder.stop();$("mic").textContent="🎙";return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];const mt=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const type=(recorder.mimeType||"audio/webm").split(";")[0];const blob=new Blob(chunks,{type});stream.getTracks().forEach(t=>t.stop());stream=null;recorder=null;try{await upload(new File([blob],"vocal-"+Date.now()+".webm",{type}));status("Vocal envoyé.")}catch(e){status(e.message)}};recorder.start();$("mic").textContent="■";status("Enregistrement… touche ■ pour envoyer.")}catch(e){status("Micro indisponible : "+e.message)}};
$("composer").onsubmit=async e=>{e.preventDefault();const v=$("message").value.trim();if(!v)return;$("send").disabled=true;try{await post(v);$("message").value="";status("Message envoyé.")}catch(e){status(e.message)}finally{$("send").disabled=false}};
(async()=>{try{await refresh();status(profile?.nickname?"Connecté · actualisation automatique":"Choisis ton pseudonyme.");setInterval(()=>refresh().catch(()=>status("Reconnexion…")),2000)}catch(e){status("Serveur indisponible : "+e.message)}})();
</script></body></html>
